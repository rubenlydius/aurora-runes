<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Runes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <canvas id="webgl"></canvas>
    <!-- rune menu (js/menu/runeMenu.js, js/ui/menuHud.js) -->
    <div class="menu" hidden>
        <div class="menu__label" hidden>
            <p class="menu__name"></p>
            <p class="menu__meaning"></p>
        </div>
        <!-- above the menu button: music volume, and the button mutes all sound -->
        <div class="sound">
            <input class="sound__volume" type="range" min="0" max="1" step="0.01" aria-label="Music volume">
            <button class="sound__button" type="button" aria-label="Mute all sound" aria-pressed="false">
                <svg viewBox="0 0 14 12" aria-hidden="true">
                    <line x1="1" y1="4.5" x2="1" y2="7.5" />
                    <line x1="3" y1="2.5" x2="3" y2="9.5" />
                    <line x1="5" y1="3.5" x2="5" y2="8.5" />
                    <line x1="7" y1="1" x2="7" y2="11" />
                    <line x1="9" y1="3" x2="9" y2="9" />
                    <line x1="11" y1="2" x2="11" y2="10" />
                    <line x1="13" y1="4.5" x2="13" y2="7.5" />
                </svg>
            </button>
        </div>
        <!-- next to the menu button: reopens the tutorial -->
        <button class="help-button" type="button" aria-label="How to cast a rune">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <polyline points="4.5,5 6,2.5 10,2.5 11.5,5 11.5,6.5 8,9 8,11" />
                <!-- the dot: a small square tilted 45° -->
                <rect x="7.2" y="13.2" width="1.6" height="1.6" transform="rotate(45 8 14)" />
            </svg>
        </button>
    </div>
    <!-- tutorial (js/ui/tutorial.js): opens after loading while no rune is discovered yet -->
    <div class="tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
        <div class="tutorial__panel">
            <h2 class="tutorial__title" id="tutorial-title">Cast a rune</h2>
            <ol class="tutorial__steps">
                <li class="tutorial__step">
                    <div class="tutorial__art">
                        <span class="tutorial__key tutorial__key--hold">space</span>
                    </div>
                    <p>Hold the spacebar</p>
                </li>
                <li class="tutorial__step">
                    <div class="tutorial__art">
                        <!-- Thurisaz in two strokes (stave, then thorn); the dot is the cursor following them -->
                        <svg viewBox="0 0 120 80" aria-hidden="true">
                            <path class="tutorial__stroke tutorial__stroke--first" pathLength="1" d="M50.4 8 L50.4 72" />
                            <path class="tutorial__stroke tutorial__stroke--second" pathLength="1" d="M50.4 25.9 L69.6 40 L50.4 54.1" />
                        </svg>
                        <span class="tutorial__cursor"></span>
                    </div>
                    <p>Click and drag to draw a rune in the sky</p>
                </li>
                <li class="tutorial__step">
                    <div class="tutorial__art tutorial__art--cast">
                        <svg viewBox="0 0 120 80" aria-hidden="true">
                            <path class="tutorial__rune" d="M50.4 8 L50.4 72 M50.4 25.9 L69.6 40 L50.4 54.1" />
                        </svg>
                        <span class="tutorial__key tutorial__key--release">space</span>
                    </div>
                    <p>Release the spacebar to cast it</p>
                </li>
            </ol>
            <p class="tutorial__note" hidden>Best experienced on desktop with a mouse and keyboard.</p>
            <button class="tutorial__close" type="button">Got it</button>
        </div>
    </div>
    <button class="menu-button" type="button" aria-label="Rune menu (Esc)" aria-expanded="false"></button>
